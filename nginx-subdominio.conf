server {
    listen 80;
    server_name admin.tudominio.com.ar;

    # Redirigir HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.tudominio.com.ar;

    # SSL — Let's Encrypt (Donweb lo genera automaticamente)
    ssl_certificate     /etc/letsencrypt/live/admin.tudominio.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.tudominio.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Raiz del frontend (archivos de dist/)
    root /home/tuusuario/admin.tudominio.com.ar/public_html;
    index index.html;

    # Seguridad basica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy al backend Node.js para /api/*
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # React SPA — todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
